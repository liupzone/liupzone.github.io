    <section class="site-search-hero"><div class="shell"><div class="eyebrow">SITE SEARCH / ALL CONTENT</div><h1>搜索全站内容</h1><p>一次检索校招稳稳拿OFFER、宝藏资源、考研之路和生活福利。支持多个关键词、空格与常见同义词，输入局部词也能匹配。</p><form class="site-search-box" id="siteSearchForm"><input id="siteSearchInput" type="search" placeholder="搜索公司、技术、科目、书籍或影视资源" autocomplete="off" autofocus /><button type="submit">模糊搜索 →</button></form></div></section>

    const guides = [

      ['京东校招备考攻略','京东 Java Redis MySQL 电商 物流 分布式锁','campus-prep/jd.html','assets/jd-campus-prep-cover.svg'],

      ['OPPO 校招备考攻略','OPPO 手机 影像 ColorOS C++ Java AI','campus-prep/oppo.html','assets/oppo-campus-prep-cover.svg'],

      ['谷歌（Google）校招备考攻略','谷歌 Google Python Java 算法 Search Cloud AI 系统设计','campus-prep/google.html','assets/google-campus-prep-cover.svg'],
      ['蚂蚁集团校招备考攻略','蚂蚁 支付 金融科技 Java TCC 分布式事务','campus-prep/ant.html','assets/ant-campus-prep-cover.svg'],
      ['哔哩哔哩校招备考攻略','B站 bilibili Go C++ 弹幕 直播 内容社区','campus-prep/bilibili.html','assets/bilibili-campus-prep-cover.svg'],
      ['小红书校招备考攻略','小红书 REDnote Go Python 推荐 内容理解 性能','campus-prep/xiaohongshu.html','assets/xiaohongshu-campus-prep-cover.svg'],

      ['携程校招备考攻略','携程 Trip.com 旅行 Java Apollo 交易系统 全球化','campus-prep/ctrip.html','assets/ctrip-campus-prep-cover.svg'],

      ['科大讯飞校招备考攻略','科大讯飞 语音 大模型 AI Python C++ SQL','campus-prep/iflytek.html','assets/iflytek-campus-prep-cover.svg'],
      ['米哈游校招备考攻略','米哈游 miHoYo 游戏 C++ 引擎 图形学 服务端','campus-prep/mihoyo.html','assets/mihoyo-campus-prep-cover.svg'],
      ['地平线校招备考攻略','地平线 Horizon BPU 芯片 模型量化 嵌入式 AI C++','campus-prep/horizon.html','assets/horizon-campus-prep-cover.svg'],
      ['Momenta 校招备考攻略','Momenta 自动驾驶 数据飞轮 共享内存 IPC C++','campus-prep/momenta.html','assets/momenta-campus-prep-cover.svg'],
      ['小鹏汽车校招备考攻略','小鹏 XPENG XNGP BEV protobuf gRPC 智能驾驶','campus-prep/xpeng.html','assets/xpeng-campus-prep-cover.svg'],
      ['理想汽车校招备考攻略','理想 Li Auto AD Max 智能座舱 C++ 量产工程','campus-prep/lixiang.html','assets/lixiang-campus-prep-cover.svg'],
      ['华为智能驾驶校招备考攻略','华为智能驾驶 ADS MDC 传感器融合 Autosar C++','campus-prep/huawei-intelligent-driving.html','assets/huawei-intelligent-driving-campus-prep-cover.svg'],
      ['文远知行校招备考攻略','文远知行 WeRide Robotaxi SLAM ROS2 C++ Python','campus-prep/weride.html','assets/weride-campus-prep-cover.svg'],
      ['宇树科技校招备考攻略','宇树 Unitree 四足机器人 强化学习 FOC 运动控制','campus-prep/unitree.html','assets/unitree-campus-prep-cover.svg'],
      ['优必选科技校招备考攻略','优必选 UBTECH 人形机器人 具身智能 WBC C++ Python','campus-prep/ubtech.html','assets/ubtech-campus-prep-cover.svg'],
      ['追觅科技校招备考攻略','追觅 Dreame 清洁机器人 SLAM RTOS 嵌入式 C++','campus-prep/dreame.html','assets/dreame-campus-prep-cover.svg']
    ];
    const input=document.getElementById('siteSearchInput'), guideList=document.getElementById('guideResultList'), treasureList=document.getElementById('treasureResultList'), examList=document.getElementById('examResultList'), lifeList=document.getElementById('lifeResultList'), summary=document.getElementById('searchSummary'), empty=document.getElementById('searchEmpty');
    let resources=[];
    const esc=(value)=>String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const aliases={'计算机':'计算机 电脑 编程 代码 coding','编程':'编程 计算机 代码 coding','程序':'程序 编程 代码 coding 算法','搜索':'搜索 查找 检索 search','人工智能':'人工智能 AI 大模型 机器学习 LLM','自动驾驶':'自动驾驶 智驾 无人驾驶 机器人 robot','资料':'资料 资源 课程 材料 合集','电影':'电影 影视 剧集 动画','纪录片':'纪录片 BBC','书籍':'书籍 书 阅读 图书 名著','考研':'考研 研究生 复试 初试 调剂','校招':'校招 秋招 春招 校园招聘 offer 岗位 面试','测试':'测试 测开 QA','机器人':'机器人 robot 自动驾驶 控制','汽车':'汽车 智驾 车载 自动驾驶','英语':'英语 english 启蒙','教辅':'教辅 学习 资料 作业','中学':'初中 高中 中考 高考','小学':'小学 小初 幼小 启蒙'};
    function normalize(value){return String(value).toLowerCase().normalize('NFKC').replace(/[\s\p{P}\p{S}]+/gu,'');}
    function queryTerms(value){const base=String(value).trim().toLowerCase();if(!base)return[];const raw=base.split(/[\s\p{P}\p{S}]+/u).filter(Boolean);const source=raw.length?raw:[base];const extras=source.flatMap(token=>String(aliases[token]||'').toLowerCase().split(/\s+/));return[...new Set([...source,...extras].map(normalize).filter(Boolean))];}
    function fuzzyMatch(text,terms){if(!terms.length)return true;const normalizedText=normalize(text);return terms.some(term=>normalizedText.includes(term)||term.includes(normalizedText));}
    function resultCard(item,type){if(type==='guide'){return '<a class="site-result" href="'+esc(item.href)+'"><div><strong>'+esc(item.title)+'</strong><p>'+esc(item.keywords)+'</p><small>校招稳稳拿OFFER · 公司专项攻略</small></div><img src="'+esc(item.img)+'" alt="'+esc(item.title)+'封面" /></a>';}return '<a class="site-result resource" href="'+esc(item.url)+'" target="_blank" rel="noopener noreferrer"><div><strong>'+esc(item.name)+'</strong><p>'+esc(item.category)+' · '+esc(item.group)+'</p><small>'+(type==='exam'?'考研之路':'宝藏资源')+' · 打开原始资源</small></div><span class="go">打开 ↗</span></a>';}
    function render(){
      const query=input.value.trim(),terms=queryTerms(query);document.getElementById('clearSearch').hidden=!query;
      const foundGuides=query?guides.filter(([title,keywords])=>fuzzyMatch(title+' '+keywords,terms)):guides;
      const isExam=item=>item.category==='考研'||/考研/.test(item.name);
      const foundTreasure=query?resources.filter(item=>!isExam(item)&&fuzzyMatch(item.name+' '+item.category+' '+item.group,terms)):resources.filter(item=>!isExam(item));
      const foundExam=query?resources.filter(item=>isExam(item)&&fuzzyMatch(item.name+' '+item.category+' '+item.group,terms)):resources.filter(isExam);
      guideList.innerHTML=foundGuides.map(item=>resultCard({title:item[0],keywords:item[1],href:item[2],img:item[3]},'guide')).join('');
      treasureList.innerHTML=foundTreasure.slice(0,query?120:20).map(item=>resultCard(item,'resource')).join('');
      examList.innerHTML=foundExam.slice(0,100).map(item=>resultCard(item,'exam')).join('');
      lifeList.innerHTML='';
      document.getElementById('guideCount').textContent=foundGuides.length;document.getElementById('treasureCount').textContent=foundTreasure.length;document.getElementById('examCount').textContent=foundExam.length;document.getElementById('lifeCount').textContent='0';
      summary.innerHTML=query?'<strong>搜索结果</strong><span> · '+foundGuides.length+' 篇攻略，'+foundTreasure.length+' 份资源，'+foundExam.length+' 份考研资料，生活福利筹备中</span>':'<strong>全部内容</strong><span> · 输入关键词开始检索</span>';
      empty.classList.toggle('show',Boolean(query)&&foundGuides.length===0&&foundTreasure.length===0&&foundExam.length===0);
      document.getElementById('guideResults').hidden=query&&foundGuides.length===0;document.getElementById('treasureResults').hidden=query&&foundTreasure.length===0;document.getElementById('examResults').hidden=query&&foundExam.length===0;
    }
    document.getElementById('siteSearchForm').addEventListener('submit',(event)=>event.preventDefault());
    let searchTimer;
    input.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(render,80);});
    document.getElementById('clearSearch').addEventListener('click',()=>{input.value='';input.focus();render();});
    document.getElementById('themeToggle').addEventListener('click',()=>{const dark=document.body.classList.toggle('dark');document.body.classList.toggle('light',!dark);document.getElementById('themeToggle').textContent=dark?'☼':'☾';});
    fetch('resources-data.js').then(response=>response.text()).then(source=>{const start=source.indexOf('[');const end=source.lastIndexOf(']');resources=JSON.parse(source.slice(start,end+1));render();}).catch(()=>{document.getElementById('treasureCount').textContent='暂不可用';render();});
  </script>
